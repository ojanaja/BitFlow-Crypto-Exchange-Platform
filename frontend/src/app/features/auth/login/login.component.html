<div class="flex justify-center items-center h-screen bg-gray-100">
  <mat-card class="w-full max-w-md p-6">
    <mat-card-header>
      <mat-card-title class="text-2xl font-bold mb-4">Login to BitFlow</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" placeholder="Enter your username">
            <mat-error *ngIf="submitted && f['username'].errors">Username is required</mat-error>
          </mat-form-field>
        </div>
        <div class="mb-6">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password" placeholder="Enter your password">
            <mat-error *ngIf="submitted && f['password'].errors">Password is required</mat-error>
          </mat-form-field>
        </div>
        <div *ngIf="error" class="text-red-500 mb-4 text-sm">{{ error }}</div>
        <div class="flex flex-col gap-4">
          <button mat-raised-button color="primary" [disabled]="loading" type="submit" class="w-full h-12">
            Login
          </button>
          <a routerLink="/register" class="text-center text-blue-600 hover:underline">Don't have an account? Register</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
