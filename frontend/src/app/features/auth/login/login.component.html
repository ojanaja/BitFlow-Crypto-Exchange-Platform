<div class="login-container">
  <div class="glass-card">
    <div class="logo-area">
      <h1 class="title">BITFLOW</h1>
      <p class="subtitle">Next Gen Crypto Exchange</p>
    </div>
    
    <div class="action-area">
      <div *ngIf="error" class="error-message">{{ error }}</div>
      
      <button class="connect-btn" (click)="connectWallet()" [disabled]="loading">
        <span *ngIf="!loading">Connect Wallet</span>
        <span *ngIf="loading">Connecting...</span>
      </button>
    </div>
  </div>
</div>
