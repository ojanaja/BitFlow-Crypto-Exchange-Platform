<div class="flex justify-center items-center h-screen bg-gray-100">
  <mat-card class="w-full max-w-md p-6">
    <mat-card-header>
      <mat-card-title class="text-2xl font-bold mb-4">Register for BitFlow</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" placeholder="Choose a username">
            <mat-error *ngIf="submitted && f['username'].errors">Username is required</mat-error>
          </mat-form-field>
        </div>
        <div class="mb-4">
            <mat-form-field appearance="outline" class="w-full">
              <mat-label>Email</mat-label>
              <input matInput formControlName="email" placeholder="Enter your email">
              <mat-error *ngIf="submitted && f['email'].errors?.['required']">Email is required</mat-error>
              <mat-error *ngIf="submitted && f['email'].errors?.['email']">Enter a valid email</mat-error>
            </mat-form-field>
          </div>
        <div class="mb-6">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password" placeholder="Choose a password">
            <mat-error *ngIf="submitted && f['password'].errors?.['required']">Password is required</mat-error>
            <mat-error *ngIf="submitted && f['password'].errors?.['minlength']">Password must be at least 6 characters</mat-error>
          </mat-form-field>
        </div>
        <div *ngIf="error" class="text-red-500 mb-4 text-sm">{{ error }}</div>
        <div class="flex flex-col gap-4">
          <button mat-raised-button color="primary" [disabled]="loading" type="submit" class="w-full h-12">
            Register
          </button>
          <a routerLink="/login" class="text-center text-blue-600 hover:underline">Already have an account? Login</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
