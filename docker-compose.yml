version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bitflow_postgres
    environment:
      POSTGRES_USER: bitflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bitflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bitflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitflow_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bitflow_db
      SPRING_DATASOURCE_USERNAME: bitflow
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - bitflow-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitflow_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bitflow-network

networks:
  bitflow-network:
    driver: bridge

volumes:
  postgres_data:
